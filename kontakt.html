<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olles AB kontakt</title>

    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="kontakt.css">
</head>
<body>
    <main>
        <section class="kontaktformulär" aria-labelledby="kontakt-rubrik">
            <h1 id="kontakt-rubrik">Kontakta oss!</h1>

            <form class="kontaktform" method="post">
                <fieldset class="namnfält">
                    <label>
                        <span>Förnamn</span>
                        <input type="text" name="förnamn" autocomplete="given-name" placeholder="Förnamn" required>
                    </label>
                    <label>
                        <span>Efternamn</span>
                        <input type="text" name="efternamn" autocomplete="family-name" placeholder="Efternamn" required>
                    </label>
                </fieldset>

                <label>
                    <span>E-postadress</span>
                    <input type="email" name="epost" autocomplete="email" placeholder="exempel@exempel.com" required>
                </label>

                <label>
                    <span>Telefonnummer</span>
                    <input type="tel" name="telefon" autocomplete="tel" placeholder="070-123 45 67" required>
                </label>

                <label class="kommentarsfält">
                    <span>Meddelande (frivillig)</span>
                    <textarea name="meddelande" rows="6" placeholder="Skriv ditt meddelande här..." required></textarea>
                </label>

                <button type="submit">Skicka meddelande</button>
            </form>
        </section>
    </main>

        <footer>
        <img class="logga" src="Olles AB bilder/Olles-ab-logga-fast-mörk.png" alt="Olles AB logga">
